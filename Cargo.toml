[workspace]
resolver = "2"
members = ["stacks-core", "stacks-import", "stacks-api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "1"
tempfile = "3"
regex = "1"
stacks-core = { path = "stacks-core" }
